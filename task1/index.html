<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traditional Books</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="one">
    <div id="first">
      <h2>Traditional Books</h2>
    </div>

    <div class="two">
      <ul><a href="home">Home</a></ul>
      <ul><a href="about">About</a></ul>
    </div>
  </nav>

  <div class="three">
    <img src="../../Javascript/task1/images/banner.png" alt="photos" width="100%" height="200px">
  </div>

  <div class="four" style="text-align: center;">
    <input
      style="margin-top: 20px; width: 220px; height: 45px; border-radius: 8px; padding: 10px; font-weight: 500;"
      id="inputdatas" type="text" placeholder="Enter traditional books..."><br><br>

    <button
      style="width: 120px; height: 45px; background-color: brown; color: white; font-weight: 500; border-radius: 11px; margin-top: 21px;"
      id="btn">Search</button><br>
  </div>

  <p id="result" style="text-align:center;"></p>
  <img id="photo" src="" alt="" width="320px"
    style="display: block; margin: 25px auto; border-radius: 10px;">

  <!-- Section 1 -->
  <section>
    <div class="card" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/silapathikaram.png" alt="photo" width="300px" height="250px">
        <h2>Silapathikaram</h2>
      </div>

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/mani.png" alt="photo" width="300px" height="250px">
        <h2>Manimegalai</h2>
      </div>

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/thiru.png" alt="photo" width="300px" height="250px">
        <h2>Thirukural</h2>
      </div>

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/nanuru.png" alt="photo" width="300px" height="250px">
        <h2>Purananuru</h2>
      </div>
    </div>
  </section>

  <!-- Section 2 -->
  <section>
    <div class="card1" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/nanuru.png" alt="photo" width="300px" height="250px">
        <h2>Purananuru</h2>
      </div>

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/nall.png" alt="photo" width="300px" height="250px">
        <h2>Naladiyar</h2>
      </div>

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/aaga.png" alt="photo" width="300px" height="250px">
        <h2>Agananuru</h2>
      </div>

      <div
        style="width: 350px; height: 310px; padding: 20px; border-radius: 10px; background-color: rgba(226, 221, 221, 0.918);">
        <img src="../../Javascript/task1/images/periya.png" alt="photo" width="300px" height="250px">
        <h2>Periyapuranam</h2>
      </div>

    </div>
  </section>

  <!-- Quote Section -->
  <section>
    <div
      style="background-color: rgb(222, 135, 135); color: aliceblue; text-align: center; width: 94%; height: 160px; margin: 30px auto; border-radius: 12px; padding: 10px;">
      <h2>"தமிழ் என் உயிர்!"</h2>
      <h5>Experience the richness of Tamil literature and wisdom</h5>
      <form>
        <button id="ten"
          style="background-color: rgb(8, 160, 49); color: white; height: 40px; width: 300px; border-radius: 14px; font-size: medium; font-weight: 500;">Register
          for Tamil quotes</button>
      </form>
    </div>
  </section>

  <!-- Registration Section -->
  <section>
    <div id="nine" class="button" style="text-align: center; display: none;">
      <h1>Register your favourite quotes</h1><br>

      <input id="name" style="width: 250px; height: 40px; border-radius: 8px; padding: 6px;" type="text"
        placeholder="Name"><br><br>

      <input id="number" style="width: 250px; height: 40px; border-radius: 8px; padding: 6px;" type="text"
        placeholder="Mobile no"><br><br>

      <input id="quotes" style="width: 250px; height: 40px; border-radius: 8px; padding: 6px;" type="text"
        placeholder="Tamil quotes"><br><br>

      <input id="books" style="width: 250px; height: 40px; border-radius: 8px; padding: 6px;" type="text"
        placeholder="Book name"><br><br>
    </div>

    <div id="enter" style="text-align: center; display: none;">
      <button id="save"
        style="width: 110px; height: 35px; background-color: brown; color: aliceblue; border-radius: 10px;">Submit</button>
    </div>
  </section>

  <script>
    const btn_1 = document.getElementById("btn");
    const btn_2 = document.getElementById("ten");
    const register = document.getElementById("nine");
    const last = document.getElementById("enter");

    btn_1.addEventListener("click", () => {
      const datas = document.getElementById("inputdatas").value.toLowerCase();
      const photo = document.getElementById("photo");
      const para = document.getElementById("result");

      para.textContent = "";
      photo.src = "";

      if (datas === "silapathikaram") {
        photo.src = "images/silapathikaram.png";
      } else if (datas === "periyapuranam") {
        photo.src = "images/periya.png";
      } else if (datas === "pathupattu" || datas === "padhitrupathu") {
        photo.src = "images/pathu.png";
      } else if (datas === "manimegalai") {
        photo.src = "images/mani.png";
      } else if (datas === "thirukural") {
        photo.src = "images/thiru.png";
      } else if (datas === "naladiyar" || datas === "nalladiyar") {
        photo.src = "images/nall.png";
      } else if (datas === "purananuru") {
        photo.src = "images/nanuru.png";
      } else if (datas === "agananuru") {
        photo.src = "images/aaga.png";
      } else {
        para.textContent = "Book not found!";
      }
    });

    btn_2.addEventListener("click", (e) => {
      e.preventDefault();
      register.style.display = "block";
      last.style.display = "block";
    });

    
    const students = [];
    const namelist = document.getElementById("name");
    const quoteslist = document.getElementById("quotes");
    const numberlist = document.getElementById("number");
    const booklist = document.getElementById("books");
    const submitlist = document.getElementById("save");

    submitlist.addEventListener("click", () => {
      const name = namelist.value
      const quotes = quoteslist.value
      const number = numberlist.value
      const books = booklist.value

      if (name === "" || quotes === "" || number === "" || books === "") {
        alert("Please fill all fields");
        return;
      }

      students.push({ name, quotes, number, books });
      console.log(students);

      
      namelist.value = "";
      quoteslist.value = "";
      numberlist.value = "";
      booklist.value = "";

      alert("Registered successfully!");
    });
  </script>

</body>
</html>
